<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeonBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class ="site-header"><!-- 网站顶部 -->
        <div class="header-container"><!-- 顶部容器 -->
            <div class="logo">
                LeonBlog
            </div>

            <nav class="main-nav">
                {{ main_navigation }}
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Per Aspera Ad Astra</h1>
                <p>循此苦旅,以达天际.穿越逆境,直抵繁星</p>
            </div>
        </section>

        <section class="category-section">
            <div class="category-container">
                {{ category_cards }}
            </div>
        </section>

    </main>


    <footer class="site-footer">
        <div class="footer-container">
            <div><strong>LeonBlog</strong><p>记录数学、密码学、科研与项目。</p></div>
            <p class="footer-quote">“Per Aspera Ad Astra.”</p>
            <!-- Replace the label with the actual filing number when supplied. -->
            <a class="icp-link" href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">ICP备案</a>
        </div>
    </footer>

</body>
</html>
