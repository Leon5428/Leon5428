<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ stylesheet_url }}">
    <link rel="stylesheet" href="{{ category_stylesheet_url }}">
</head>
<body class="category-page">
    <a class="skip-link" href="#category-content">跳转到主题列表</a>
    <header class="site-header">
        <div class="header-container">
            <a href="{{ home_url }}" class="logo">LeonBlog</a>
            <nav class="main-nav" aria-label="主导航">{{ main_navigation }}</nav>
        </div>
    </header>

    <main class="category-main" id="category-content" tabindex="-1">
        <header class="category-intro">
            <p class="category-eyebrow">知识笔记 <span aria-hidden="true">/</span> 分类总览</p>
            <h1>{{ title }}</h1>
            <div class="category-description">
                <p>按主题整理，循章节阅读。</p>
                <p class="category-statistics">{{ subject_count }} 个主题<span aria-hidden="true">·</span>{{ chapter_count }} 篇目</p>
            </div>
        </header>

        <section class="subject-section" aria-labelledby="subjects-heading">
            <div class="subject-section-heading">
                <h2 id="subjects-heading">全部主题</h2>
                <span>从一个主题开始</span>
            </div>
            <div class="subject-cards">{{ subject_cards }}</div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div><strong>LeonBlog</strong><p>记录数学、密码学、科研与项目。</p></div>
            <p class="footer-quote">“Per Aspera Ad Astra.”</p>
            <a class="icp-link" href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">ICP备案</a>
        </div>
    </footer>
</body>
</html>
