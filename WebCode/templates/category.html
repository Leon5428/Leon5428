<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ stylesheet_url }}">
</head>
<body class="category-page">
    <a class="skip-link" href="#subjects">跳转到科目列表</a>
    <header class="site-header">
        <div class="header-container">
            <a href="{{ home_url }}" class="logo">LeonBlog</a>
            <nav class="main-nav" aria-label="主导航">{{ main_navigation }}</nav>
        </div>
    </header>
    <main>
        <section class="hero category-hero">
            <div class="hero-content">
                <h1>{{ title }}</h1>
                <p>{{ subject_count }} 个科目 · {{ chapter_count }} 篇文章</p>
            </div>
        </section>
        <section class="category-section" id="subjects" tabindex="-1" aria-label="科目列表">
            <div class="category-container">{{ subject_cards }}</div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-container">
            <div><strong>LeonBlog</strong><p>记录数学、密码学、科研与项目。</p></div>
            <p class="footer-quote">“Per Aspera Ad Astra.”</p>
            <a class="icp-link" href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">ICP备案</a>
        </div>
    </footer>
</body>
</html>
