<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ category_description }}">
    <title>{{ page_title }}</title>
    <link rel="icon" href="{{ favicon_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ base_stylesheet_url }}">
    <link rel="stylesheet" href="{{ stylesheet_url }}">
    <link rel="stylesheet" href="{{ category_stylesheet_url }}">
</head>
<body class="category-page">
    <a class="skip-link" href="#subjects">跳转到内容列表</a>
    <header class="site-header">
        <div class="header-container">
            <a href="{{ home_url }}" class="logo">LeonBlog</a>
            <nav class="main-nav" aria-label="主导航">{{ main_navigation }}</nav>
        </div>
    </header>
    <main class="landing-main">
        <section class="hero category-hero" aria-labelledby="category-title">
            <img class="hero-image" src="{{ hero_image_url }}" alt="" fetchpriority="high">
            <div class="hero-content">
                <h1 id="category-title">{{ title }}</h1>
                <p>{{ category_description }}</p>
            </div>
        </section>
        <section class="category-section" id="subjects" tabindex="-1" aria-labelledby="collection-title">
            <div class="collection-heading">
                <h2 id="collection-title">{{ collection_title }}</h2>
                <p>{{ collection_summary }}</p>
            </div>
            <div class="category-container">{{ subject_cards }}</div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-container">
            <div><strong>LeonBlog</strong><p>记录数学、密码学、科研与项目。</p></div>
            <p class="footer-quote">“Per Aspera Ad Astra.”</p>
            <a class="icp-link" href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">ICP备案</a>
        </div>
    </footer>
</body>
</html>
