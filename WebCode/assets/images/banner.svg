<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Leon — Mathematics, Cryptography, and Code</title>
  <desc id="desc">A midnight-blue terminal and an orbital illustration. Per Aspera Ad Astra. Keep learning, keep exploring.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#14233b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8badd1" stroke-opacity=".07"/></pattern>
  </defs>
  <rect x="1" y="1" width="958" height="338" rx="18" fill="url(#bg)" stroke="#303b50"/>
  <rect x="1" y="1" width="958" height="338" rx="18" fill="url(#grid)"/>
  <g fill="#7791af"><circle cx="610" cy="44" r="2"/><circle cx="882" cy="87" r="2"/><circle cx="916" cy="249" r="2"/><circle cx="593" cy="266" r="2"/><circle cx="780" cy="37" r="1.5"/></g>
  <g transform="translate(36 30)">
    <rect width="514" height="280" rx="12" fill="#0d1117" stroke="#303b50"/>
    <path d="M0 36H514" stroke="#303b50"/>
    <circle cx="19" cy="18" r="5" fill="#ff7b72"/><circle cx="37" cy="18" r="5" fill="#e3b341"/><circle cx="55" cy="18" r="5" fill="#3fb950"/>
    <g font-family="Consolas, monospace">
      <text x="80" y="22" font-size="11" fill="#8b949e">leon@github: ~/learning</text>
      <text x="24" y="72" font-size="14" fill="#7ee787">$ whoami</text>
      <text x="24" y="129" font-family="Georgia, serif" font-size="54" fill="#e6edf3">Hello, I'm Leon.</text>
      <text x="26" y="165" font-size="14" fill="#79c0ff">Mathematics / Cryptography / Code</text>
      <text x="26" y="204" font-size="13" fill="#8b949e">Keep learning, keep exploring.</text>
      <text x="26" y="246" font-size="14" fill="#bc8cff">$ build understanding</text>
      <rect x="224" y="233" width="9" height="16" fill="#bc8cff"/>
    </g>
  </g>
  <g transform="translate(750 150)">
    <circle r="81" fill="#17243a" stroke="#304865"/>
    <ellipse rx="139" ry="45" transform="rotate(-30)" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <ellipse rx="139" ry="45" transform="rotate(30)" fill="none" stroke="#bc8cff" stroke-opacity=".65"/>
    <circle cx="120" cy="-65" r="7" fill="#79c0ff"/>
    <circle cx="-112" cy="-60" r="4" fill="#bc8cff"/>
    <text text-anchor="middle" y="14" font-family="Georgia, serif" font-size="48" fill="#e6edf3">∀ ∃</text>
    <text text-anchor="middle" y="40" font-family="Consolas, monospace" font-size="11" fill="#79c0ff">QUESTION · PROVE · BUILD</text>
  </g>
  <text x="750" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#c9d8eb">Per Aspera Ad Astra.</text>
  <rect x="638" y="301" width="224" height="2" rx="1" fill="url(#accent)"/>
</svg>
